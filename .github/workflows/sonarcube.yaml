name: SonarQube Scan

on:
  push:
    branches: 
        - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ai-writing-grading
            -Dsonar.organization=ai-writing-grading
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.test.inclusions=test/**/*.test.ts,test/**/*.test.tsx,test/**/*.spec.ts,test/**/*.spec.tsx
            -Dsonar.exclusions=src/routeTree.gen.ts
            -Dsonar.coverage.exclusions=src/main.tsx,src/routeTree.gen.ts,src/vite-env.d.ts,src/lib/api-config.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
